name: Migrate database

# Runs every migration on push to main, after saving a full copy of the database.
# The backup is uploaded as a workflow artifact (kept 90 days). If the backup fails, nothing is migrated.

on:
  push:
    branches: [main]
    paths: [supabase/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: uwclblkzpohkkzrpiibe
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link to the Supabase project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Back up the database before migrating
        run: |
          mkdir -p backup
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          supabase db dump --linked -f "backup/schema-$stamp.sql"
          supabase db dump --linked --data-only -f "backup/data-$stamp.sql"
      - name: Keep the backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: backup/
          retention-days: 90
          if-no-files-found: error
      - name: Apply migrations
        run: supabase db push --linked
